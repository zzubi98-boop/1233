<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171923"><title>림버스 TRPG 캠페인 보조실</title>
<style>
:root{color-scheme:dark;--bg:#11131a;--panel:#1b1f2b;--line:#343a4b;--muted:#a5adbf;--gold:#d8b879;--text:#edf0f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Noto Sans KR",sans-serif}header{padding:24px max(18px,calc((100% - 1080px)/2));background:#191d28;border-bottom:1px solid var(--line)}h1{font-size:23px;margin:0 0 4px}header p,.muted{color:var(--muted)}.wrap{max-width:1080px;margin:auto;padding:22px 16px 55px}nav,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button,.tab{border:1px solid var(--line);background:#252b39;color:var(--text);padding:9px 13px;border-radius:8px;cursor:pointer}.tab.active{border-color:var(--gold);color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:15px}h2{font-size:18px;margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}input,textarea,select{width:100%;background:#11151e;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:10px;font:inherit}textarea{min-height:100px;resize:vertical}.field{margin-top:12px}section[hidden]{display:none}.primary{background:#6e5730;border-color:#9d804c}.danger{color:#ffb8bd;border-color:#824b52}.entry{padding:11px 0;border-top:1px solid var(--line);white-space:pre-wrap}.entry button{float:right}footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}
</style></head><body>
<header><h1>림버스 TRPG 캠페인 보조실</h1><p>GM은 ChatGPT, 플레이어는 당신. 이곳은 캠페인 상태와 플레이 기록을 보관합니다.</p></header>
<main class="wrap"><nav><button class="tab active" data-tab="campaign">캠페인</button><button class="tab" data-tab="character">캐릭터</button><button class="tab" data-tab="journal">진행 기록</button><button class="tab" data-tab="npcs">NPC 관계</button><button class="tab" data-tab="backup">백업·복원</button></nav>
<section id="campaign"><div class="panel"><h2>캠페인 정보</h2><div class="grid"><div><label>캠페인 제목</label><input data-field="title" placeholder="새로운 캠페인"></div><div><label>현재 장 / 날짜</label><input data-field="chapter" placeholder="프롤로그"></div><div><label>현재 장소</label><input data-field="location"></div><div><label>상태</label><select data-field="status"><option>진행 중</option><option>일시 정지</option><option>완결</option></select></div></div><div class="field"><label>현재 상황 요약 · GM 인계용</label><textarea data-field="summary" placeholder="확정된 사건, 현재 목표, 미해결 문제"></textarea></div></div><div class="panel"><h2>GM 인계 메모</h2><textarea data-field="handoff" placeholder="다음 장면에서 반드시 기억할 사항"></textarea><p class="muted">판정과 전투는 제공된 림버스 TRPG 자료를 기준으로 처리합니다. 이 메모가 규칙을 대신하지 않습니다.</p></div></section>
<section id="character" hidden><div class="panel"><h2>플레이어 캐릭터</h2><div class="grid"><div><label>이름</label><input data-field="character.name"></div><div><label>호칭 / 별칭</label><input data-field="character.alias"></div><div><label>소속</label><input data-field="character.affiliation"></div><div><label>역할 / 직업</label><input data-field="character.role"></div></div><div class="field"><label>능력치·자원 (룰북에 정의된 값만)</label><textarea data-field="character.stats" placeholder="수치와 출처를 함께 기록"></textarea></div><div class="field"><label>특성·장비·상태</label><textarea data-field="character.notes"></textarea></div></div></section>
<section id="journal" hidden><div class="panel"><h2>진행 기록</h2><label>새 기록</label><textarea id="entryText" placeholder="플레이어 행동, GM 묘사, 판정 결과, 사건 결과"></textarea><div class="actions"><button class="primary" id="addEntry">기록 추가</button></div><div id="entries"></div></div></section>
<section id="npcs" hidden><div class="panel"><h2>NPC 관계 기록</h2><div class="grid"><div><label>NPC 이름</label><input id="npcName"></div><div><label>관계 / 태도</label><input id="npcRelation"></div></div><div class="field"><label>메모</label><textarea id="npcNotes"></textarea></div><div class="actions"><button class="primary" id="addNpc">NPC 추가</button></div><div id="npcList"></div></div></section>
<section id="backup" hidden><div class="panel"><h2>JSON 백업·복원</h2><p class="muted">데이터는 이 브라우저에 자동 저장됩니다. 다른 기기에서 이어 하려면 JSON 백업을 옮겨 복원하세요.</p><div class="actions"><button class="primary" id="export">JSON 백업 다운로드</button><label class="tab">JSON 복원 <input id="importFile" type="file" accept=".json,application/json" hidden></label><button class="danger" id="reset">초기화</button></div><p id="msg" class="muted"></p></div></section>
<footer>캠페인 보조 도구 · 스토리 진행과 규칙 판정은 ChatGPT 대화에서 수행합니다.</footer></main>
<script>
const KEY='limbus-trpg-campaign-v1',blank=()=>({title:'새로운 캠페인',chapter:'프롤로그',location:'',status:'진행 중',summary:'',handoff:'',character:{name:'',alias:'',affiliation:'',role:'',stats:'',notes:''},entries:[],npcs:[]});
let d;try{d={...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{d=blank()}d.character={...blank().character,...(d.character||{})};d.entries=d.entries||[];d.npcs=d.npcs||[];
const read=p=>p.split('.').reduce((o,k)=>o?.[k],d),save=()=>localStorage.setItem(KEY,JSON.stringify(d)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelectorAll('[data-field]').forEach(el=>{let p=el.dataset.field;el.value=read(p)??'';el.addEventListener('input',()=>{let a=p.split('.'),o=d;for(let k of a.slice(0,-1))o=o[k]??(o[k]={});o[a.at(-1)]=el.value;save()})});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!==b.dataset.tab)});
function render(){entries.innerHTML=d.entries.map((e,i)=>'<div class="entry"><b>'+esc(e.date)+'</b><button class="danger" data-e="'+i+'">삭제</button><div>'+esc(e.text)+'</div></div>').join('')||'<p class="muted">기록이 없습니다.</p>';npcList.innerHTML=d.npcs.map((n,i)=>'<div class="entry"><b>'+esc(n.name)+'</b> · '+esc(n.relation)+'<button class="danger" data-n="'+i+'">삭제</button><div>'+esc(n.notes)+'</div></div>').join('')||'<p class="muted">등록된 NPC가 없습니다.</p>'}
addEntry.onclick=()=>{let t=entryText.value.trim();if(!t)return;d.entries.unshift({date:new Date().toLocaleString('ko-KR'),text:t});entryText.value='';save();render()};
addNpc.onclick=()=>{let name=npcName.value.trim();if(!name)return;d.npcs.push({name,relation:npcRelation.value,notes:npcNotes.value});npcName.value=npcRelation.value=npcNotes.value='';save();render()};
document.addEventListener('click',e=>{if(e.target.dataset.e!==undefined){d.entries.splice(+e.target.dataset.e,1);save();render()}if(e.target.dataset.n!==undefined){d.npcs.splice(+e.target.dataset.n,1);save();render()}});
export.onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.href=u;a.download='limbus-trpg-campaign.json';a.click();URL.revokeObjectURL(u);msg.textContent='백업 다운로드를 시작했습니다.'};
importFile.onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x||typeof x!=='object'||Array.isArray(x))throw 0;d={...blank(),...x};d.character={...blank().character,...(d.character||{})};d.entries=d.entries||[];d.npcs=d.npcs||[];save();location.reload()}catch{msg.textContent='올바른 캠페인 JSON 파일이 아닙니다.'}};
reset.onclick=()=>{if(confirm('저장된 캠페인 데이터를 초기화할까요?')){d=blank();save();location.reload()}};render();
</script></body></html>
